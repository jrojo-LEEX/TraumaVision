[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traumavision"
version = "2.1.0"
description = "Sistema de Soporte a la Decisión Clínica para detección de fracturas en muñeca pediátrica"
requires-python = ">=3.11"
authors = [{ name = "Juan Pablo Rojo" }]

# Las versiones exactas están en requirements.txt. Acá van las dependencias
# mínimas para que `pip install -e .` deje el proyecto importable.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1.0",
    "ultralytics>=8.3.0",
    "opencv-python>=4.10.0",
    "Pillow>=10.4.0",
    "numpy>=1.26.0",
    "pydicom>=2.4.0",
    "sqlalchemy>=2.0.0",
    "reportlab>=4.2.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "psutil>=7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]

# Instalar en modo editable para que `app`, `config` y `src` sean importables
# desde cualquier directorio:
#     pip install -e .
# Eso es lo que reemplaza a los sys.path.insert que había en cada módulo.
[tool.setuptools.packages.find]
include = ["app*", "config*", "src*"]
exclude = ["tests*", "venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
